<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minimal Calendar</title>

<link rel="manifest" href="manifest.json">>

<meta name="theme-color" content="#dedbd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #dedbd6; color: #202020;
    display: flex; justify-content: center; align-items: center;
}
.calendar-app {
    width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
    padding: 20px 20px 15px; display: flex; flex-direction: column; justify-content: space-between;
}
.top-date { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 5px; }
.big-date { font-size: 64px; line-height: .8; font-weight: 700; letter-spacing: -4px; }
.day-name { font-size: 16px; font-weight: 600; color: #77736f; margin-bottom: 2px; }
.month-section { margin-top: 15px; }
.month { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
.year { font-size: 14px; color: #77736f; margin-top: 2px; }
.calendar { margin-top: 12px; }
.weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekday { text-align: center; font-size: 10px; color: #77736f; font-weight: 600; height: 16px; }
.day {
    aspect-ratio: 1; width: 100%; max-width: 34px; border-radius: 50%; margin: 0 auto;
    display: flex; justify-content: center; align-items: center; font-size: 0; cursor: pointer;
}
.day.empty { background: transparent; }
.day.future { background: #c9c7c4; }
.day.completed { background: #202020; }
.day.selected, .day.today { background: #ff6818; }
.selected-info { margin-top: 15px; }
.selected-title { font-size: 13px; font-weight: 700; }
.selected-subtitle { font-size: 11px; color: #77736f; margin-top: 2px; }
.navigation { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.nav-btn { border: none; background: transparent; font-size: 22px; cursor: pointer; color: #202020; padding: 0 10px; }
.nav-month { font-size: 12px; font-weight: 700; }
.notes-section { margin-top: 12px; flex: 1; display: flex; flex-direction: column; min-height: 80px; }
.notes-label { font-size: 11px; font-weight: 700; color: #77736f; margin-bottom: 5px; text-transform: uppercase; }
.notes-textarea {
    width: 100%; height: 100%; padding: 10px; background: rgba(255, 255, 255, 0.4);
    border: 1px solid #ccc9c5; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none;
}
footer { margin-top: 10px; text-align: center; font-size: 11px; color: #77736f; font-weight: 600; }
\nbody { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }\nbutton, textarea { -webkit-user-select: none; user-select: none; }\ntextarea { -webkit-user-select: text; user-select: text; }\n</style>
</head>

<body>

<div class="calendar-app">
    <div class="top-date">
        <div class="big-date" id="bigDate">11</div>
        <div class="day-name" id="dayName">Tue</div>
    </div>

    <div class="month-section">
        <div class="month" id="monthName">FEBRUARY</div>
        <div class="year" id="yearName">2026</div>
    </div>

    <div class="calendar">
        <div class="weekdays">
            <div class="weekday">S</div><div class="weekday">M</div><div class="weekday">T</div>
            <div class="weekday">W</div><div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div>
        </div>
        <div class="days" id="days"></div>
    </div>

    <div class="selected-info">
        <div class="selected-title" id="selectedTitle">Tuesday, February 11</div>
        <div class="selected-subtitle">Select any date</div>
    </div>

    <div class="navigation">
        <button class="nav-btn" onclick="previousMonth()">‹</button>
        <div class="nav-month" id="navMonth">FEBRUARY 2026</div>
        <button class="nav-btn" onclick="nextMonth()">›</button>
    </div>

    <div class="notes-section">
        <div class="notes-label">Notes</div>
        <textarea class="notes-textarea" id="noteInput" placeholder="Write your notes here..." oninput="saveNote()"></textarea>
    </div>

    <footer>Designed by Bhim Mondal</footer>
</div>

<script>
let currentDate = new Date();
let selectedDate = new Date();

const monthNames = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthName").textContent = monthNames[month];
    document.getElementById("yearName").textContent = year;
    document.getElementById("navMonth").textContent = monthNames[month] + " " + year;

    const daysContainer = document.getElementById("days");
    daysContainer.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        daysContainer.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const circle = document.createElement("div");
        circle.className = "day";
        const thisDate = new Date(year, month, day);

        if (thisDate < selectedDate) {
            circle.classList.add("completed");
        } else if (
            day === selectedDate.getDate() &&
            month === selectedDate.getMonth() &&
            year === selectedDate.getFullYear()
        ) {
            circle.classList.add("selected");
        } else {
            circle.classList.add("future");
        }

        circle.onclick = function () {
            selectedDate = new Date(year, month, day);
            updateSelected();
            renderCalendar();
        };

        daysContainer.appendChild(circle);
    }

    updateSelected();
}

function updateSelected() {
    const day = selectedDate.getDate();
    const month = selectedDate.getMonth();
    const year = selectedDate.getFullYear();

    document.getElementById("bigDate").textContent = day;
    document.getElementById("dayName").textContent = dayNames[selectedDate.getDay()].substring(0, 3);
    document.getElementById("selectedTitle").textContent = dayNames[selectedDate.getDay()] + ", " + monthNames[month].charAt(0) + monthNames[month].slice(1).toLowerCase() + " " + day;

    loadNote();
}

function previousMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
}

function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
}

function getNoteKey() {
    return `note_${selectedDate.getFullYear()}_${selectedDate.getMonth()}_${selectedDate.getDate()}`;
}

function saveNote() {
    const text = document.getElementById("noteInput").value;
    localStorage.setItem(getNoteKey(), text);
}

function loadNote() {
    const savedText = localStorage.getItem(getNoteKey()) || "";
    document.getElementById("noteInput").value = savedText;
}

renderCalendar();
\nif ("serviceWorker" in navigator) {\n  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));\n}\n</script>

</body>
</html>
